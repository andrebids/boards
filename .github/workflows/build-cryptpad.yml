name: Build CryptPad image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem CryptPad customizada'
        required: true
      source_ref:
        description: 'Branch ou commit a construir; vazio usa a ref atual'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push CryptPad image
        uses: docker/build-push-action@v6
        with:
          context: infra/cryptpad
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/boards-cryptpad:${{ inputs.image_tag }}
          cache-from: type=gha,scope=cryptpad
          cache-to: type=gha,mode=max,scope=cryptpad
