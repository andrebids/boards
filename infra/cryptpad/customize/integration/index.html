<!DOCTYPE html>
<html>
<head>
    <title data-localization="main_title">CryptPad: Collaboration suite, encrypted and open-source</title>
    <meta content="text/html; charset=utf-8" http-equiv="content-type"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/png" href="/customize/favicon/main-favicon.png" id="favicon"/>
    <script src="/customize/pre-loading.js?ver=1787557641846"></script>
    <link href="/customize/src/pre-loading.css?ver=1.0" rel="stylesheet" type="text/css">
    <script>
        (function () {
            var onlyOfficeCachePrefix = 'document_editor_static_';
            var onlyOfficeScope = '/common/onlyoffice/dist/';

            function clearOnlyOfficeStaticCache() {
                if (!window.caches) {
                    return Promise.resolve();
                }

                return window.caches.keys().then(function (cacheNames) {
                    return Promise.all(cacheNames.filter(function (cacheName) {
                        return cacheName.indexOf(onlyOfficeCachePrefix) === 0;
                    }).map(function (cacheName) {
                        return window.caches.delete(cacheName);
                    }));
                });
            }

            function unregisterOnlyOfficeWorkers() {
                if (!navigator.serviceWorker) {
                    return Promise.resolve();
                }

                return navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    return Promise.all(registrations.filter(function (registration) {
                        return registration.scope.indexOf(onlyOfficeScope) !== -1;
                    }).map(function (registration) {
                        return registration.unregister();
                    }));
                });
            }

            function bootIntegration() {
                var script = document.createElement('script');
                script.setAttribute('data-bootload', '/integration/main.js');
                script.setAttribute('data-main', '/common/boot.js?ver=1.0');
                script.src = '/components/requirejs/require.js?ver=2.3.7';
                document.head.appendChild(script);
            }

            Promise.all([
                clearOnlyOfficeStaticCache(),
                unregisterOnlyOfficeWorkers(),
            ]).then(bootIntegration, bootIntegration);
        }());
    </script>
    <link href="/customize/src/outer.css?ver=1.3.2" rel="stylesheet" type="text/css">
</head>
