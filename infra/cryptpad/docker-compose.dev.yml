# Serviço independente do Planka. Não partilha rede, volumes nem credenciais com boards-dev-*.
services:
  cryptpad:
    build:
      context: .
      dockerfile: Dockerfile
    image: planka-cryptpad:2026.5.1
    restart: unless-stopped
    environment:
      CPAD_MAIN_DOMAIN: ${CPAD_MAIN_DOMAIN:-http://localhost:3010}
      CPAD_SANDBOX_DOMAIN: ${CPAD_SANDBOX_DOMAIN:-http://localhost:3013}
      CPAD_CONF: /cryptpad/config/config.js
      CPAD_INSTALL_ONLYOFFICE: 'yes'
    ports:
      - '127.0.0.1:3010:3000'
      # O sandbox é um segundo origin HTTP servido pelo mesmo processo principal.
      # O WebSocket usa um porto separado para a colaboração em tempo real.
      - '127.0.0.1:3013:3000'
      - '127.0.0.1:3012:3012'
    volumes:
      - ./config/config.js:/cryptpad/config/config.js
      - ./data/blob:/cryptpad/blob
      - ./data/block:/cryptpad/block
      - ./data/data:/cryptpad/data
      - ./data/files:/cryptpad/datastore
      - ./customize:/cryptpad/customize
      - ./customize/integration/index.html:/cryptpad/www/integration/index.html
      - ./customize/presentation/inner.html:/cryptpad/www/presentation/inner.html
      # A distribuição ONLYOFFICE contém milhares de ficheiros. Um volume
      # Docker evita o rdfind ficar bloqueado no bind mount do Windows.
      - cryptpad-onlyoffice-dist:/cryptpad/www/common/onlyoffice/dist
      - ./onlyoffice-conf:/cryptpad/onlyoffice-conf
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

volumes:
  cryptpad-onlyoffice-dist:
    name: cryptpad_onlyoffice_dist
